{% extends 'base.html' %}{% block content %}<div class="page-title"><span class="eyebrow">حسابي</span><h1>طلباتي</h1><p>طلباتك اللي سجلتها وأنت داخل بحسابك.</p></div><div class="panel"><h2>سجل الطلبات</h2>{% for o in orders %}<div class="summary-line account-order"><strong dir="ltr">{{o.reference}}</strong><span>{{o.status}}</span><strong>{{money(o.total)}} ج.م</strong></div>{% else %}<p class="subtle">لسه مفيش طلبات مرتبطة بحسابك.</p><a class="btn btn-dark" href="/#catalog">تصفح المنتجات</a>{% endfor %}</div><form method="post" action="/logout" class="logout-row"><input type="hidden" name="csrf" value="{{csrf}}"><button class="btn btn-outline">تسجيل الخروج</button></form>{% endblock %}
